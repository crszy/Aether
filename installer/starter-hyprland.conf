# Aether: starter hyprland.conf (Hyprland's own syntax) - written only if you had none.
# Used by the Hyprland window manager (komorebi fork) and Aether's Settings > Hyprland. Edit freely.
# Alt is the main key here (Super combos clash with Windows: Win+L locks, Win+K casts). With
# "Alt works like Super" on (Settings > Hyprland), every SUPER bind also works with ALT.

$mainMod = SUPER
$terminal = wt.exe
$fileManager = explorer.exe

general {
    layout = dwindle
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
}

decoration {
    rounding = 10
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
    mfact = 0.55
}

input {
    follow_mouse = 0          # 0: click to focus, like Windows | 1: focus follows the mouse
}

# ---- Alt: focus / move (vim keys), workspaces ----
bind = ALT, H, movefocus, l
bind = ALT, J, movefocus, d
bind = ALT, K, movefocus, u
bind = ALT, L, movefocus, r
bind = ALT SHIFT, H, swapwindow, l
bind = ALT SHIFT, J, swapwindow, d
bind = ALT SHIFT, K, swapwindow, u
bind = ALT SHIFT, L, swapwindow, r
bind = ALT, Q, killactive
bind = ALT, T, togglefloating
bind = ALT SHIFT, F, fullscreen, 1
bind = ALT SHIFT, R, forcerendererreload
bind = ALT, 1, workspace, 1
bind = ALT, 2, workspace, 2
bind = ALT, 3, workspace, 3
bind = ALT, 4, workspace, 4
bind = ALT, 5, workspace, 5
bind = ALT SHIFT, 1, movetoworkspace, 1
bind = ALT SHIFT, 2, movetoworkspace, 2
bind = ALT SHIFT, 3, movetoworkspace, 3
bind = ALT SHIFT, 4, movetoworkspace, 4
bind = ALT SHIFT, 5, movetoworkspace, 5
# Aether extras: the workspace overview and layouts
bind = ALT, O, overview
# infinite canvas (InfiniteDesk): ALT+C go there and back, ALT+SHIFT+C push the window onto it, ALT+SHIFT+N brings it back
bind = ALT, C, canvas
bind = ALT SHIFT, C, movetocanvas
# wallpaper: ALT+W the next one, ALT+SHIFT+W a random one (rapid presses flow into each other)
bind = ALT, W, aether, wallpaper next
bind = ALT SHIFT, W, aether, wallpaper random
bind = ALT, B, setlayout, bsp
bind = ALT, S, setlayout, scrolling

# ---- Super (also on Alt when "Alt works like Super" is on and the Alt combo is free) ----
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up, swapwindow, u
bind = $mainMod SHIFT, down, swapwindow, d
binde = $mainMod CTRL, left, resizeactive, -40 0
binde = $mainMod CTRL, right, resizeactive, 40 0
binde = $mainMod CTRL, up, resizeactive, 0 -40
binde = $mainMod CTRL, down, resizeactive, 0 40
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# windows that should float instead of tiling
windowrule = float, class:^(Calculator|SnippingTool|Taskmgr)$
